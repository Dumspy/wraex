[package]
name = "wraex-app"
description = "The Wraex desktop app: Rune UI on top of the core crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "wraex_app"
path = "src/lib.rs"

[[bin]]
name = "wraex"
path = "src/main.rs"

[dependencies]
rune = { workspace = true }
# The platform poll loop reads the clipboard synchronously.
arboard = { version = "3.7", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
wraex-core = { workspace = true }
wraex-game = { workspace = true }
wraex-platform = { workspace = true }
wraex-poe1 = { workspace = true }
wraex-poe2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
dirs = "7"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false }

[lints]
workspace = true
