[package]
name = "wraex-app"
description = "The Wraex desktop app: Rune UI on top of the core crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "wraex_app"
path = "src/lib.rs"

[[bin]]
name = "wraex"
path = "src/main.rs"

[dependencies]
rune = { workspace = true }
# The live shell's OS halves: the clipboard behind `wraex_platform::clipboard::Clipboard`
# (Rune's own clipboard API is asynchronous and only writes; the platform module's poll
# loop is a blocking read) and PNG decoding for the tray icon.
arboard = { version = "3.7", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
wraex-core = { workspace = true }
wraex-game = { workspace = true }
wraex-platform = { workspace = true }
wraex-poe1 = { workspace = true }
wraex-poe2 = { workspace = true }

[dev-dependencies]
# The update worker's tests hash their in-memory setup the way a release publishes it.
sha2 = { workspace = true }

[lints]
workspace = true
