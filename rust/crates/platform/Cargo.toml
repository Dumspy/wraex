[package]
name = "wraex-platform"
description = "Native platform services: game window tracking, hotkeys, input, clipboard, logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
tray-icon = { workspace = true }
ureq = { workspace = true }
wraex-core = { workspace = true }

# The Win32 window hook (`window::win32`): `SetWinEventHook`, the foreground queries, the
# client-rectangle and DPI calls, and `SetForegroundWindow` for the focus hand-back. Only the
# features those calls need; the rest of the crate would be dead weight.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = { workspace = true }
wraex-golden = { workspace = true }

[lints]
workspace = true
