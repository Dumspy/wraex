[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Dumspy/wraex"

[workspace.dependencies]
wraex-core = { path = "crates/core" }
wraex-game = { path = "crates/game" }
wraex-poe1 = { path = "crates/poe1" }
wraex-poe2 = { path = "crates/poe2" }
wraex-platform = { path = "crates/platform" }
wraex-golden = { path = "crates/golden" }

# Rune is pre-release: pin a rev of `dev`, which is never rewritten. Bump on purpose.
rune = { git = "https://github.com/anomalyco/rune", rev = "209e119c27724f0f6449d519c1e314103bb19047" }

serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats exactly. The default fast path can land on a
# neighbouring double, so fixture values (JavaScript numbers) would not round-trip.
# preserve_order: JavaScript objects iterate in insertion order, and a trade request
# body hashed for the screenshot recordings must serialise in the order upstream
# built it. `wraex_golden::canonical` sorts keys itself, so fixtures are unaffected.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
# The screenshot harness names a recorded request after the first 8 hex digits of
# its body's SHA-1 (`tools/golden/screens/host.mjs`); replay must build the same name.
sha1 = "0.10"
thiserror = "2"
# Insertion-ordered maps: JavaScript objects iterate in insertion order, and the
# ported logic walks data maps (`trade.ids`, ...) in that order.
indexmap = { version = "2", features = ["serde"] }
# JavaScript regexes need look-behind and back-references (`wraex_core::js_regex`).
fancy-regex = "0.20"
# Blocking HTTP with rustls for the trade API (`wraex_platform::http`): a few
# requests per second on a worker thread need no async runtime.
ureq = "3"
# The transport's cookie jar, like Electron's persistent default session: RFC 6265
# domain/path/expiry matching and the JSON persistence of the expiring cookies.
# ureq's own `cookies` feature hands `Set-Cookie` to the jar before any middleware
# sees it, so the `Partitioned` attribute could not be stripped first.
cookie_store = "0.22"
# `cookie_store::Cookie::parse` takes the request's `Url`; also already in the lock
# file through the HTTP stack.
url = "2"
# `String.prototype.normalize('NFKD')` (poe.ninja detail page slugs).
unicode-normalization = "0.1"
# The system tray (`wraex_platform::tray`), the crate Tauri uses. Default
# features pick the GTK 3 AppIndicator backend on Linux; they are no-ops on
# macOS and Windows.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# Cargo doesn't inherit patches from a dependency. Rune vendors these six crates at
# the rev above and needs them patched, or the build fails (`parley_engine` has no
# `line-dictionaries` feature upstream) and the Windows/Wayland fixes are missing.
# When bumping Rune, use the new rev for both the dependency and every patch.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "209e119c27724f0f6449d519c1e314103bb19047" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "209e119c27724f0f6449d519c1e314103bb19047" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "209e119c27724f0f6449d519c1e314103bb19047" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "209e119c27724f0f6449d519c1e314103bb19047" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "209e119c27724f0f6449d519c1e314103bb19047" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "209e119c27724f0f6449d519c1e314103bb19047" }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Documentation and naming conventions this workspace does not require.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# No panics in production paths; test exemptions live in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
panic_in_result_fn = "deny"
exit = "deny"

# Numeric conversions.
as_conversions = "deny"
as_underscore = "deny"
float_cmp_const = "deny"

# Error handling.
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"
try_err = "deny"
error_impl_error = "deny"

# Debugging and output.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"

# Allocation and ownership.
clone_on_ref_ptr = "deny"
str_to_string = "deny"
implicit_clone = "deny"
rc_buffer = "deny"
rc_mutex = "deny"

# Code shape and native safety.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
unneeded_field_pattern = "deny"
if_then_some_else_none = "deny"
mixed_read_write_in_expression = "deny"
mutex_atomic = "deny"
tests_outside_test_module = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
infinite_loop = "deny"
renamed_function_params = "deny"

# Enforce the configured API restrictions.
disallowed_macros = "deny"
disallowed_methods = "deny"

# Build dependencies (never the workspace crates) optimised: the tests spend much
# of their time in dependency code (JSON, Rune's renderer); about 20-30% faster.
# A clean dependency build takes ~3x longer, which rust-cache pays once in CI.
[profile.dev.package."*"]
opt-level = 2
