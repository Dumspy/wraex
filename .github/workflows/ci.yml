name: CI

on:
  push:
    branches: [development, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # ref/ holds the TypeScript reference code; cargo does not need it.
      - run: rustup show
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev pkg-config

      # Installs the channel and components from rust-toolchain.toml.
      - run: rustup show
      - run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Phase 1 adds a fixture job: regenerate fixtures from the pinned TypeScript
  # references and fail on any diff. Phase 5 adds headless UI snapshots.
