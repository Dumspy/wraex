name: CI

# Changes that cannot affect the build skip CI entirely: docs, packaging, the release
# workflow and the licence. No status check is required on the branch rules, so a
# skipped run blocks nothing; if one becomes required, this needs a job that always
# reports.
on:
  push:
    branches: [development, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/release.yml"
      - "tools/package/**"
      - "LICENSE*"
  pull_request:
    # ready_for_review is what starts CI on a draft (see the job's `if:`).
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/release.yml"
      - "tools/package/**"
      - "LICENSE*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debuginfo is most of rust-cache's ~1.8 GB and slows linking; the cost is line
  # numbers in CI backtraces. `test` inherits `dev`, and rust-cache already sets
  # CARGO_INCREMENTAL=0.
  CARGO_PROFILE_DEV_DEBUG: "0"

# Draft pull requests are pushed to repeatedly, so the job skips them; marking the PR
# ready for review runs it, and pushes to development and main never skip.
jobs:
  test:
    # One job, not one per purpose: GitHub bills each job rounded up to a whole
    # minute, and the Linux and Windows jobs repeated the same ~1 min of setup
    # (checkout, rustup, rust-cache).
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      # Read by the prebuilt nextest install; bump it when the config needs a
      # newer one.
      CARGO_NEXTEST_VERSION: "0.9.152"
      # Read by the prebuilt cargo-xwin install and by the xwin cache key, so both
      # move together on a bump.
      CARGO_XWIN_VERSION: "0.24.1"
      # Pull requests run the fast set; pushes to development and main run
      # everything (see rust/.config/nextest.toml).
      NEXTEST_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'ci' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          # The game data the poe1/poe2 crates load lives in the references.
          submodules: true

      # Installs the channel, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install

      # The cheap checks come first: they need no apt packages and no cache restore,
      # so a formatting or pin slip fails the job in seconds.
      - run: cargo fmt --all --check

      # `rune` and every vendor patch must share one rev: cargo does not inherit
      # patches, and a stale patch rev still builds when the vendored crate's
      # version did not change.
      - name: Rune revs agree
        working-directory: .
        run: |
          revs=$(grep -oE 'rev = "[0-9a-f]{40}"' rust/Cargo.toml | sort -u | wc -l)
          if [ "$revs" -ne 1 ]; then
            echo "rust/Cargo.toml has $revs different Rune revs"
            exit 1
          fi
      - name: No unused patches
        working-directory: .
        run: |
          if grep -q 'patch.unused' rust/Cargo.lock; then
            echo "rust/Cargo.lock has unused patches: bump the patch revs with rune"
            exit 1
          fi
      # No separate lockfile check: `--locked` on the clippy and nextest runs below
      # already fails when Cargo.lock is stale.

      - name: Build dependencies
        # Pull requests skip the headless snapshot below, so they skip Mesa's
        # software Vulkan with it.
        env:
          WITH_MESA: ${{ github.event_name != 'pull_request' }}
        run: |
          packages=(libxkbcommon-dev libwayland-dev pkg-config)
          # The LLVM tools cargo-xwin drives (clang-cl, lld-link, llvm-lib).
          packages+=(clang lld llvm)
          # Mesa's software Vulkan (lavapipe): the runner has no GPU, and the headless
          # snapshot below needs an adapter.
          if [ "$WITH_MESA" = "true" ]; then
            packages+=(mesa-vulkan-drivers)
            # The live tray smoke below: a private session bus, a virtual X server,
            # and the test's own StatusNotifierWatcher.
            packages+=(xvfb xauth dbus-daemon python3-dbus python3-gi)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      # The prebuilt binaries: `cargo install` would compile nextest and cargo-xwin
      # from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }},cargo-xwin@${{ env.CARGO_XWIN_VERSION }}

      # xwin downloads and unpacks the MSVC CRT and Windows SDK into cargo-xwin's
      # cache directory on first use; restoring it saves ~2 minutes on every later run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-${{ env.CARGO_XWIN_VERSION }}

      # One cache entry covers both builds: rust-cache stores the whole rust/target,
      # and the cross build writes target/x86_64-pc-windows-msvc inside it, so the
      # Windows check needs no cache of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/development' }}

      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The Win32 code (window tracking, hooks, overlay) only compiles for Windows.
      # Checked on Linux with cargo-xwin, as `devenv shell` does; running it is the
      # manual test in docs/windows-spike.md. Only Linux runners are used.
      - name: Windows clippy (cross-check)
        run: cargo xwin clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      # nextest runs each test in its own process, in parallel. It does not run
      # doctests: the workspace's only two are `ignore`d, so no step is missing.
      - name: Tests
        run: cargo nextest run --locked --workspace --profile "$NEXTEST_PROFILE"

      # Rune's headless renderer is the only CI check that the UI actually draws.
      # Pull requests skip it, as they skip the slow UI render tests.
      - name: Headless UI smoke
        if: github.event_name != 'pull_request'
        run: cargo run --locked -p wraex-app -- --snap "$RUNNER_TEMP/wraex.png"
      - name: Headless UI snapshot exists
        if: github.event_name != 'pull_request'
        run: test -s "$RUNNER_TEMP/wraex.png"

      - name: Live Linux tray smoke
        if: github.event_name != 'pull_request'
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 ../tools/linux-tray-smoke.py target/debug/wraex
